# ============================================================
# DreamsEngine C++ Style
# ============================================================

# ------------------------------------------------------------
# Indentation
# ------------------------------------------------------------

indent_columns              = 4
indent_with_tabs            = 0
indent_namespace             = true
indent_namespace_level       = 4

# Indent class/struct bodies
indent_class                 = true

# Do NOT indent braces themselves
indent_braces                = false
indent_brace                 = 0

# Access modifiers:
#
#     class Foo
#     {
#         public:
#             Foo();
#     };
#
indent_access_spec           = 4
indent_access_spec_body      = true

# ------------------------------------------------------------
# Braces / Newlines
# ------------------------------------------------------------

# Classes / structs / enums
nl_class_brace               = force
nl_struct_brace              = force
nl_union_brace                = force
nl_enum_brace                 = force

# Functions
nl_fdef_brace                 = force

# Control statements
nl_if_brace                   = remove
nl_for_brace                  = remove
nl_while_brace                = remove
nl_switch_brace               = remove
nl_do_brace                   = remove

# else / catch stay on the same line as the closing brace
nl_else_brace                 = remove
nl_elseif_brace               = remove
nl_brace_else                 = remove
nl_brace_catch                = remove
nl_catch_brace                = remove
nl_brace_while                = remove

# Namespace brace
nl_namespace_brace            = force

# ------------------------------------------------------------
# Spaces
# ------------------------------------------------------------

# if (condition), for (condition), while (condition)
sp_before_sparen              = add

# if (condition) -- no spaces inside parentheses
sp_inside_sparen              = remove

# Function calls:
# foo()
sp_func_call_paren            = remove
sp_func_call_paren_empty      = remove

# Function declarations:
# foo()
sp_func_proto_paren           = remove
sp_func_proto_paren_empty     = remove

# Function definitions:
# foo()
sp_func_def_paren             = remove
sp_func_def_paren_empty       = remove

# Pointer style:
# int* value;
sp_before_ptr_star            = remove
sp_after_ptr_star             = force

# References:
# int& value;
sp_before_byref               = remove
sp_after_byref                = force

# Operators
sp_arith                      = force
sp_assign                     = force
sp_bool                       = force
sp_compare                    = force

# Commas
sp_after_comma                = force
sp_before_comma               = remove

# Semicolons
sp_before_semi_for            = remove
sp_after_semi_for             = force

# ------------------------------------------------------------
# Alignment
# ------------------------------------------------------------

align_with_tabs               = false

# Don't try to vertically align everything
align_var_def_span            = 0
align_var_struct_span         = 0
align_func_params             = false

# ------------------------------------------------------------
# Line endings
# ------------------------------------------------------------

newlines                      = lf
